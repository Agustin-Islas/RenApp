spring.application.name=backend-dialysis-record
spring.config.import=optional:file:.env[.properties]
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Configuracion de Supabase Auth como Resource Server
# Usamos validación offline (simétrica), por lo que ya no necesitamos descargar JWKS
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://wdylgmuuvkrydqxzqdrb.supabase.co/auth/v1

# Seguridad: no exponer detalles internos en respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never

