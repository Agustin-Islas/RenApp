name: Supabase Daily Backup

on:
  schedule:
    # Se ejecuta todos los días a las 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Te permite hacer clic en un botón para ejecutarlo manualmente

jobs:
  backup-to-b2:
    runs-on: ubuntu-latest
    steps:
      - name: Generar nombre del archivo
        id: vars
        run: echo "BACKUP_FILE=backup_supabase_$(date +'%Y-%m-%d_%H%M%S').sql.gz" >> $GITHUB_ENV

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump y compresión de la base de datos Supabase
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Extraemos toda la base de datos y la comprimimos sobre la marcha
          pg_dump -h ${{ secrets.SUPABASE_DB_HOST }} \
                  -U ${{ secrets.SUPABASE_DB_USER }} \
                  -d postgres \
                  -p 5432 \
                  --clean \
                  | gzip > ${{ env.BACKUP_FILE }}

      - name: Subir el archivo a Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APP_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          # aws cli ya viene preinstalado en ubuntu-latest
          # Backblaze B2 tiene compatibilidad nativa con la API de S3
          aws s3 cp ${{ env.BACKUP_FILE }} s3://$B2_BUCKET/backups/${{ env.BACKUP_FILE }} --endpoint-url $B2_ENDPOINT
