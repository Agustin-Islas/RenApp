workflows:
  android-github-release:
    name: Android GitHub Release
    instance_type: mac_mini_m1
    working_directory: frontend
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      flutter: stable
      java: 17
      vars:
        API_BASE_URL: "https://backend-dialysis-record-system-spring.onrender.com"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze
      - name: Run unit tests
        script: flutter test test/monthly_ultrafiltration_calculator_test.dart
      - name: Build APK
        script: flutter build apk --debug --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Prepare release asset
        script: |
          RELEASE_TAG=${CM_TAG:-v1.0.0}
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/RenApp-${RELEASE_TAG}.apk
          if [ -n "$GITHUB_TOKEN" ] && [ -n "$CM_TAG" ]; then
            echo "Uploading RenApp-${RELEASE_TAG}.apk to GitHub Release ${CM_TAG}..."
            gh release upload "$CM_TAG" build/app/outputs/flutter-apk/RenApp-${RELEASE_TAG}.apk --clobber || true
          fi
    artifacts:
      - build/app/outputs/flutter-apk/RenApp-*.apk

  android-debug-apk:
    name: Android Debug APK
    instance_type: mac_mini_m1
    working_directory: frontend
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      vars:
        API_BASE_URL: "https://backend-dialysis-record-system-spring.onrender.com"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze
      - name: Build debug APK
        script: flutter build apk --debug --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-release-aab:
    name: Android Release AAB
    instance_type: mac_mini_m1
    working_directory: frontend
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        - dialysis_record_keystore
      vars:
        API_BASE_URL: "https://backend-dialysis-record-system-spring.onrender.com"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze
      - name: Build release app bundle
        script: flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk

  web-release:
    name: Web Release
    working_directory: frontend
    max_build_duration: 60
    environment:
      groups:
        - Firebase
      flutter: stable
      vars:
        API_BASE_URL: "https://backend-dialysis-record-system-spring.onrender.com"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze
      - name: Build web app
        script: flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Deploy to Firebase Hosting
        script: |
          echo "$FIREBASE_CREDENTIALS" > $CM_BUILD_DIR/firebase_credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/firebase_credentials.json
          firebase deploy --only hosting --project renapp-5b81e
    artifacts:
      - build/web/**

  windows-release:
    name: Windows Release
    instance_type: windows_x2
    working_directory: frontend
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "https://backend-dialysis-record-system-spring.onrender.com"
    scripts:
      - name: Enable Windows Desktop
        script: flutter config --enable-windows-desktop
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Windows app
        script: flutter build windows --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/windows/x64/runner/Release/**

  macos-release:
    name: macOS Release
    instance_type: mac_mini_m1
    working_directory: frontend
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "https://backend-dialysis-record-system-spring.onrender.com"
    scripts:
      - name: Enable macOS Desktop
        script: flutter config --enable-macos-desktop
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build macOS app
        script: flutter build macos --release --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - build/macos/Build/Products/Release/**
